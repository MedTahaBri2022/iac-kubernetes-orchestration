apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-demo

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: platform-demo

# Generated with a content hash in its name: editing a value produces a new
# ConfigMap, which changes the pod template and triggers a rolling update.
# A hand-written ConfigMap would be updated in place and running pods would
# silently keep the old values.
configMapGenerator:
  - name: demo-app-config
    literals:
      - GREETING=Hello
      - ENVIRONMENT=dev
      - SHUTDOWN_DELAY_MS=5000

# The release is changed here, or with `kubectl set image`.
images:
  - name: platform-demo-app
    newTag: 1.0.0
