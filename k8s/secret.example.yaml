# Shape of the Secret the Deployment expects. Real values are never committed:
# create it out-of-band, for example
#
#   kubectl -n platform-demo create secret generic demo-app-secrets \
#     --from-literal=API_TOKEN="$(openssl rand -hex 24)"
#
# In a real project this would come from a secret manager (External Secrets,
# Sealed Secrets, SOPS).
apiVersion: v1
kind: Secret
metadata:
  name: demo-app-secrets
  namespace: platform-demo
type: Opaque
stringData:
  API_TOKEN: replace-me
